<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飴・カボチャキャッチゲーム 🎃</title>
    <link rel="icon" href="アイコン.png" type="image/png">
    <style>
        body { 
            text-align: center; 
            background: #1a1126; /* 🎃 ハロウィンパープル */
            color: #f3f4f6;
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        h2 {
            color: #f97316; /* パンプキンオレンジ */
            text-shadow: 0 0 8px rgba(249, 115, 22, 0.6);
        }
        canvas { 
            background: #251c33; /* 👻 不気味な夜空をイメージしたダークカラー */
            display: block; 
            margin: 10px auto; 
            border: 2px solid #f97316; /* オレンジの枠線 */
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
            max-width: 100%; 
            height: auto; 
        }
        .btn-container { margin-top: 10px; }
        .control-btn { 
            font-size: 24px; 
            padding: 10px 30px; 
            margin: 0 10px; 
            cursor: pointer; 
            background: #f97316; /* ボタンもカボチャオレンジに 🎃 */
            color: #1a1126; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold;
            box-shadow: 0 4px 0 #ea580c;
            transition: transform 0.1s;
        }
        .control-btn:active { 
            background: #ea580c; 
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <h2>飴・カボチャキャッチゲーム 🎃</h2>
    <p>キーボード、画面のボタン、またはタッチでかごを動かそう！</p>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <!-- スマホ用ボタン -->
    <div class="btn-container">
        <button class="control-btn" id="leftBtn">←</button>
        <button class="control-btn" id="rightBtn">→</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // かごのカラーをハロウィンマジックパープル（#a855f7）に変更 🧙‍♀️
        let basket = { x: 160, y: 350, width: 80, height: 20, color: "#a855f7" };
        
        // 落ちてくるアイテムのデータ（typeを追加）
        let item = { x: Math.random() * 370, y: 0, radius: 20, speed: 3, type: "candy" };
        let score = 0;
        
        // 保存された最高得点を読み込む（ハロウィン専用）
        let highScore = localStorage.getItem("candyHighScore") || 0;

        let rightPressed = false;
        let leftPressed = false;

        // 🍬「飴.png」と 🎃「カボチャ.png」の両方を読み込む
        const candyImg = new Image();
        candyImg.src = "飴.png";

        const pumpkinImg = new Image();
        pumpkinImg.src = "カボチャ.png";

        // キーボード操作
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") rightPressed = true;
            if (e.key === "ArrowLeft") leftPressed = true;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight") rightPressed = false;
            if (e.key === "ArrowLeft") leftPressed = false;
        });

        // 画面ボタン操作（スマホ用）
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");

        leftBtn.addEventListener("mousedown", () => leftPressed = true);
        leftBtn.addEventListener("mouseup", () => leftPressed = false);
        leftBtn.addEventListener("touchstart", (e) => { leftPressed = true; e.preventDefault(); });
        leftBtn.addEventListener("touchend", (e) => { leftPressed = false; e.preventDefault(); });

        rightBtn.addEventListener("mousedown", () => rightPressed = true);
        rightBtn.addEventListener("mouseup", () => rightPressed = false);
        rightBtn.addEventListener("touchstart", (e) => { rightPressed = true; e.preventDefault(); });
        rightBtn.addEventListener("touchend", (e) => { rightPressed = false; e.preventDefault(); });

        function update() {
            if (rightPressed && basket.x < canvas.width - basket.width) basket.x += 6;
            if (leftPressed && basket.x > 0) basket.x -= 6;

            item.y += item.speed;
            
            // キャッチ判定
            if (item.y + item.radius >= basket.y &&
                item.x >= basket.x &&
                item.x <= basket.x + basket.width) {
                score++;
                
                // 最高得点を更新して保存
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("candyHighScore", highScore);
                }

                resetItem();
            }
            
            // 下まで落ちたとき
            if (item.y > canvas.height) {
                resetItem();
            }
        }

        // アイテムがリセットされるときに、飴かカボチャかをランダムで決定する
        function resetItem() {
            item.y = 0;
            item.x = Math.random() * (canvas.width - 40) + 20;
            item.speed += 0.1;
            // 50%の確率で candy か pumpkin に切り替える仕掛け 🎲
            item.type = Math.random() < 0.5 ? "candy" : "pumpkin";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // かごを描く
            ctx.fillStyle = basket.color;
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
            
            // タイプの種類に応じて描画する画像を切り替える 🔄
            if (item.type === "candy") {
                ctx.drawImage(candyImg, item.x - item.radius, item.y - item.radius, item.radius * 2, item.radius * 2);
            } else {
                ctx.drawImage(pumpkinImg, item.x - item.radius, item.y - item.radius, item.radius * 2, item.radius * 2);
            }
            
            // スコアと最高得点を描く
            ctx.fillStyle = "#fff";
            ctx.font = "bold 16px sans-serif";
            ctx.fillText("スコア: " + score, 10, 25);
            ctx.fillText("さいこう: " + highScore, 10, 50);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
