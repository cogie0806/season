<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シーズン選択</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .christmas {
            background-color: #c62828;
        }
        .christmas:hover {
            background-color: #b71c1c;
        }
        .halloween {
            background-color: #ef6c00;
        }
        .halloween:hover {
            background-color: #e65100;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>シーズンを選んでください</h1>
    <div class="links">
        <!-- クリスマスへのリンク -->
        <a href="https://cogie0806.github.io/season/クリスマス/" class="btn christmas">クリスマス</a>
        
        <!-- ハロウィンへのリンク -->
        <a href="http://cogie0806.github.io/season/ハロウィン" class="btn halloween">ハロウィン</a>
    </div>
</div>

</body>
</html>
